  <rect x="249" y="116" width="169" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="249" y="116" width="169" height="9" rx="4" fill="#0C9487"/>
  <text x="268" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Check</text>
  <text x="268" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">fmt</text>
  <text x="268" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">validate</text>
  <path d="M426 189 H452" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M444 181 L454 189 L444 197" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="464" y="116" width="169" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="464" y="116" width="169" height="9" rx="4" fill="#DBA82E"/>
  <text x="483" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Preview</text>
  <text x="483" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">plan -out</text>
  <path d="M641 189 H667" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M659 181 L669 189 L659 197" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
