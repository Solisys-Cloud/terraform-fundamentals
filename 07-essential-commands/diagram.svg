  <text x="913" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Remove</text>
  <text x="913" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">plan -destroy</text>
  <text x="913" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">destroy</text>
  <text x="34" y="304" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52657D">Read commands (fmt -check, validate, plan, show, output) change nothing. apply and destroy change real resources.</text>
