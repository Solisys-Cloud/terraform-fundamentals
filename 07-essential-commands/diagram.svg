<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="332" viewBox="0 0 1100 332" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">The daily command sequence</title>
  <desc id="diagram-description">Six commands cover most of the work. Always in this order.</desc>
  <rect width="1100" height="332" rx="22" fill="#F5F8FC"/>
  <text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#172B4D">The daily command sequence</text>
  <text x="34" y="77" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52657D">Six commands cover most of the work. Always in this order.</text>
  <rect x="34" y="116" width="169" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="34" y="116" width="169" height="9" rx="4" fill="#5E64D5"/>
  <text x="53" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Prepare</text>
  <text x="53" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">init</text>
  <path d="M211 189 H237" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
