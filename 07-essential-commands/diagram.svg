  <text x="698" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Change</text>
  <text x="698" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">apply &lt;plan&gt;</text>
  <path d="M856 189 H882" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
