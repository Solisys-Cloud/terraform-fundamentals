<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">How Terraform uses a provider</title>
  <desc id="diagram-description">Terraform reads the configuration, installs the Local provider during initialization, then uses it to manage a local file when apply is manually approved.</desc>
  <rect width="1100" height="380" rx="22" fill="#F5F8FC"/>
  <text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#172B4D">How Terraform uses a provider</text>
  <text x="34" y="77" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52657D">The provider connects Terraform configuration to a resource type.</text>

  <rect x="34" y="116" width="235" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="34" y="116" width="235" height="9" rx="4" fill="#5E64D5"/>
  <text x="53" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Configuration</text>
  <text x="53" y="192" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34506C">versions.tf</text>
  <text x="53" y="222" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34506C">main.tf</text>
  <text x="53" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#637A92">Declare a provider and resource</text>

  <path d="M277 189 H315" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M307 181 L317 189 L307 197" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="324" y="116" width="212" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="324" y="116" width="212" height="9" rx="4" fill="#0C9487"/>
  <text x="344" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Terraform CLI</text>
  <text x="344" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">terraform init</text>
  <text x="344" y="220" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">terraform plan</text>
  <text x="344" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#637A92">Apply requires your approval</text>

  <path d="M544 189 H582" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M574 181 L584 189 L574 197" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="591" y="116" width="210" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="591" y="116" width="210" height="9" rx="4" fill="#DBA82E"/>
  <text x="610" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Local provider</text>
  <text x="610" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">hashicorp/local</text>
  <text x="610" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">local_file</text>
  <text x="610" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#637A92">The plugin manages files</text>

  <path d="M809 189 H847" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M839 181 L849 189 L839 197" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="856" y="116" width="210" height="146" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="856" y="116" width="210" height="9" rx="4" fill="#397CC0"/>
  <text x="875" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Local resource</text>
  <text x="875" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">provider-demo.txt</text>
  <text x="875" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#34506C">Created on your PC</text>
  <text x="875" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#637A92">No Azure account needed</text>

  <rect x="34" y="288" width="1032" height="58" rx="11" fill="#E7F1FA" stroke="#C4DBF1"/>
  <text x="550" y="315" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#234C75" text-anchor="middle">Version constraint: versions.tf    |    Exact selected version: .terraform.lock.hcl</text>
  <text x="550" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#54738F" text-anchor="middle">Review and commit the lock file to keep provider dependencies consistent.</text>
</svg>
