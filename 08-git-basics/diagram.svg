<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="362" viewBox="0 0 1100 362" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Where your changes live</title>
  <desc id="diagram-description">A change moves through three local areas before it reaches a remote.</desc>
  <rect width="1100" height="362" rx="22" fill="#F5F8FC"/>
  <text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#172B4D">Where your changes live</text>
  <text x="34" y="77" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#52657D">A change moves through three local areas before it reaches a remote.</text>
  <rect x="34" y="116" width="223" height="176" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="34" y="116" width="223" height="9" rx="4" fill="#5E64D5"/>
  <text x="53" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Working directory</text>
  <text x="53" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">Files you edit</text>
  <text x="53" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git status</text>
  <text x="53" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git diff</text>
  <path d="M265 204 H291" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M283 196 L293 204 L283 212" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="303" y="116" width="223" height="176" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="303" y="116" width="223" height="9" rx="4" fill="#0C9487"/>
  <text x="322" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Staging area</text>
  <text x="322" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">Changes you selected</text>
  <text x="322" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git add</text>
  <text x="322" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git diff --staged</text>
  <path d="M534 204 H560" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M552 196 L562 204 L552 212" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="572" y="116" width="223" height="176" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="572" y="116" width="223" height="9" rx="4" fill="#DBA82E"/>
  <text x="591" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Local repository</text>
  <text x="591" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">Saved commits</text>
  <text x="591" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git commit</text>
  <text x="591" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git log</text>
  <path d="M803 204 H829" stroke="#8194AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M821 196 L831 204 L821 212" fill="none" stroke="#8194AB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="841" y="116" width="223" height="176" rx="14" fill="#FFFFFF" stroke="#CEDAE6" stroke-width="2"/>
  <rect x="841" y="116" width="223" height="9" rx="4" fill="#C2557A"/>
  <text x="860" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#182F51">Remote</text>
  <text x="860" y="192" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">Shared copy</text>
  <text x="860" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git push</text>
  <text x="860" y="252" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#34506C">git pull</text>
  <text x="34" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#52657D">Nothing leaves your computer until you run git push.</text>
</svg>
